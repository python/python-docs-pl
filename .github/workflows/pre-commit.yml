name: pre-commit
on:
  schedule:
    - cron: '0 0 * * 1,5'
env:
  FORCE_COLOR: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: tox-dev/action-pre-commit-uv@v1
